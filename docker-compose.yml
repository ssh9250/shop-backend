services:
  app:
    build: .
    container_name: shop-app
    env_file: .env
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - shop-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: shop-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - shop-net
    restart: unless-stopped

networks:
  shop-net:
    external: true          # infra에서 생성한 네트워크를 공유
    name: shop-net