spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testDB;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6370   # EmbeddedRedisConfig(@TestConfiguration)가 이 포트로 내장 Redis 시작
  main:
    allow-bean-definition-overriding: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.study.shop: debug
    org.springframework.web: debug
    org.springframework.security: debug
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: debug

jwt:
  secret: SldUU2lnbmluZ0tleUZvclNlY3VyZUF1dGhlbnRpY2F0aW9uSW5TcHJpbmdCb290QXBwbGljYXRpb25XaXRoSFMyNTZBbGdvcml0aG0=
  access-expiration-ms: 1800000
  refresh-expiration-ms: 1209600000

file:
  upload-dir: uploads/posts
