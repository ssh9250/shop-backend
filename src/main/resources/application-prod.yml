spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://shop-mysql:3306/shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # prod는 validate — 실수로 스키마 변경 방지
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false       # prod는 SQL 로그 끄기
  data:
    redis:
      host: shop-redis          # Docker 서비스명으로 접근
      port: 6379
  main:
    allow-bean-definition-overriding: true

springdoc:
  swagger-ui:
    enabled: false              # prod는 Swagger 비활성화
  api-docs:
    enabled: false

logging:
  level:
    root: warn
    com.study.shop: info

jwt:
  secret: ${JWT_SECRET}         # 환경변수로 주입